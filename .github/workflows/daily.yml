name: Daily LLM Paper Digest

on:
  schedule:
    # UTC; corresponds to 05:07, 06:27, 07:47, 09:07 in UTC+8.
    # Multiple attempts mitigate GitHub schedule delays/drops; idempotency
    # ensures only the first successful delivery sends the digest.
    - cron: "7 21 * * *"
    - cron: "27 22 * * *"
    - cron: "47 23 * * *"
    - cron: "7 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and deliver digest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-6-luna' }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.zhizengzeng.com/v1' }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_LIMIT: ${{ vars.HF_LIMIT || '100' }}
          TOP_N: ${{ vars.TOP_N || '3' }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_OPEN_ID: ${{ secrets.FEISHU_OPEN_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python daily_paper.py

      - name: Upload digest artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest
          path: daily_digest.md
          if-no-files-found: ignore
          retention-days: 14
